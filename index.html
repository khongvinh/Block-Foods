<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#d6f1e1">
<title>Block Foods</title>
<style>
:root{
  --wood1:#eefaf1; --wood2:#d6f1e1; --wood3:#bfe6d0; --fg:#1f4a37;
  --board:#5a341c; --board-edge:#3e2211; --cell:#4a2a16; --cell-line:#3a2010;
  --cream:#fff6e6; --ink:#3b2412; --accent:#e85d2a; --green:#3fae5a; --gold:#ffc83d;
  --bw:min(92vw, 420px, 54vh);
  --cs:calc((var(--bw) - 20px) / 8);
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{
  font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--fg);
  background:#c9a77c;
}
/* Nền gian bếp chung cho mọi màn; lớp kem mờ giúp chữ và bàn chơi dễ đọc */
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,246,226,.62),rgba(255,246,226,.38) 45%,rgba(60,30,10,.12)),url("assets/bg-kitchen.webp") center bottom/cover no-repeat}
body::before{display:none;content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22220%22%20height%3D%22220%22%20font-size%3D%2230%22%20font-family%3D%22Apple%20Color%20Emoji%2CSegoe%20UI%20Emoji%2CNoto%20Color%20Emoji%2Csans-serif%22%3E%3Ctext%20x%3D%2218%22%20y%3D%2248%22%3E%F0%9F%A5%A2%3C/text%3E%3Ctext%20x%3D%22130%22%20y%3D%2270%22%3E%F0%9F%8D%B2%3C/text%3E%3Ctext%20x%3D%2260%22%20y%3D%22140%22%3E%F0%9F%AB%96%3C/text%3E%3Ctext%20x%3D%22160%22%20y%3D%22180%22%3E%F0%9F%8C%BF%3C/text%3E%3Ctext%20x%3D%2214%22%20y%3D%22205%22%3E%F0%9F%8D%9A%3C/text%3E%3Ctext%20x%3D%22120%22%20y%3D%22125%22%20font-size%3D%2222%22%3E%F0%9F%8C%B6%EF%B8%8F%3C/text%3E%3C/svg%3E");background-size:220px 220px}
.emoji{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
button{font:inherit;cursor:pointer;border:0}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;padding:max(12px,env(safe-area-inset-top)) 16px 16px}
.screen.on{display:flex}

/* ---------- Buttons ---------- */
.btn{background:linear-gradient(#ff8a3d,#e85d2a);color:#fff;font-weight:800;font-size:20px;padding:14px 22px;border-radius:16px;
  box-shadow:0 5px 0 #a8391a,0 8px 16px rgba(0,0,0,.25);min-width:240px;text-shadow:0 2px 0 rgba(0,0,0,.2);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a8391a}
.btn.green{background:linear-gradient(#6fd36f,#3fae5a);box-shadow:0 5px 0 #23763a,0 8px 16px rgba(0,0,0,.25)}
.btn.brown{background:linear-gradient(#a8724a,#7a4a26);box-shadow:0 5px 0 #4b2a12,0 8px 16px rgba(0,0,0,.25)}
.icon-btn{width:44px;height:44px;border-radius:12px;background:linear-gradient(#f2c48f,#d79b5f);color:var(--ink);font-size:22px;font-weight:900;
  box-shadow:0 3px 0 #9a6234;display:grid;place-items:center}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #9a6234}

/* ---------- Home ---------- */
#home{justify-content:flex-start;gap:0;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,248,232,.55),rgba(255,248,232,0) 38%),url("assets/bg-kitchen.webp") center bottom/cover no-repeat,#c9a77c}
#home>*{position:relative;z-index:1}
#home .home-float{position:absolute;inset:0;z-index:0;pointer-events:none}
.home-float img{position:absolute;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25));animation:drift 5s ease-in-out infinite}
.home-float .f1{width:84px;left:-14px;top:30%;animation-delay:-1s}
.home-float .f2{width:92px;right:-18px;top:24%;--r:12deg;animation-delay:-2.5s}
.home-float .f3{width:76px;left:-10px;top:63%;--r:-10deg;animation-delay:-3.2s}
.home-float .f4{width:58px;right:-4px;top:58%;--r:18deg;animation-delay:-.6s}
.home-float .f5{width:70px;right:-8px;bottom:6%;animation-delay:-4s}
@keyframes drift{0%,100%{transform:translateY(0) rotate(var(--r,-6deg))}50%{transform:translateY(-14px) rotate(calc(var(--r,-6deg) * -1))}}
.logo-img{margin:0;line-height:0}
.logo-img img{width:min(78vw,320px);height:auto;filter:drop-shadow(0 6px 10px rgba(80,40,10,.35));animation:logoIn .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes logoIn{from{transform:translateY(-40px) scale(.85);opacity:0}}
.tray-img{width:min(84vw,340px);height:auto;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3));animation:trayIn .6s .15s both,sway 4s 1s ease-in-out infinite}
@keyframes trayIn{from{transform:translateY(20px);opacity:0}}
@keyframes sway{50%{transform:rotate(-1.2deg) translateY(-3px)}}
.home-btns{display:flex;flex-direction:column;gap:8px;align-items:center}
.imgbtn{background:none;padding:0;width:min(78vw,310px);line-height:0;transition:transform .1s;animation:btnIn .45s both}
.imgbtn img{width:100%;height:auto;filter:drop-shadow(0 5px 6px rgba(60,30,10,.35))}
.imgbtn:active{transform:scale(.95) translateY(2px)}
.imgbtn:focus-visible,.woodicon:focus-visible{outline:3px solid #fff;outline-offset:2px;border-radius:14px}
.home-btns>button:nth-child(1){animation-delay:.25s}.home-btns>button:nth-child(2){animation-delay:.33s}
.home-btns>button:nth-child(3){animation-delay:.41s}.home-btns>button:nth-child(4){animation-delay:.49s}
@keyframes btnIn{from{transform:translateY(24px);opacity:0}}
.imgbtn.pulse img{animation:pulse 1.8s 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.woodicon{width:52px;height:52px;padding:0;background:none;line-height:0;position:relative;transition:transform .1s}
.woodicon img{width:100%;height:100%;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.woodicon:active{transform:scale(.92)}
.woodicon.off img{filter:grayscale(1) brightness(.85);opacity:.7}
.woodicon.off::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:5px;margin-top:-2px;background:#c0392b;border-radius:3px;transform:rotate(-40deg);box-shadow:0 0 0 2px #fff}
@media (prefers-reduced-motion:reduce){#home *{animation:none!important}}
.home-bar{width:100%;max-width:440px;display:flex;justify-content:flex-end;gap:8px;flex:0 0 auto}
.icon-btn.off{opacity:.45;filter:grayscale(1)}
.home-main{flex:1;min-height:0;width:100%;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;padding-block:4px 8px}
.home-main::before,.home-main::after{content:"";flex:1 1 0}
@media (max-height:720px){
  .logo-img img{width:min(66vw,250px)} .tray-img{width:min(74vw,280px)}
  .imgbtn{width:min(72vw,270px)} .home-main{gap:9px} .home-btns{gap:6px}
  .home-float .f1,.home-float .f2{top:34%}
}
.logo{text-align:center;margin-bottom:10px}
.logo .tiles{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.logo .tiles span{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;font-size:28px;font-weight:900;color:#fff;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),inset 0 3px 0 rgba(255,255,255,.35),0 4px 8px rgba(0,0,0,.3);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.logo h1{margin:4px 0 0;font-size:44px;line-height:1;color:#ff7a2f;text-shadow:0 4px 0 #b8461a,0 8px 14px rgba(184,70,26,.25);letter-spacing:1px}
.logo p{margin:8px 0 0;color:var(--fg);font-weight:600;opacity:.9}
.floaters{font-size:34px;letter-spacing:6px;margin:4px 0 14px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.bestline{text-align:center;color:#5a341c;font-weight:800;font-size:13px;line-height:1.4;width:min(86vw,340px);padding:14px 26px;
  background:url("assets/panel-light.webp") center/100% 100% no-repeat;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));animation:btnIn .45s .57s both}

/* ---------- Level select / book ---------- */
.topbar{width:100%;max-width:440px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.topbar h2{margin:0;font-size:24px;color:#5a341c;display:flex;align-items:center;gap:6px;text-shadow:0 2px 0 #fff,0 0 10px rgba(255,255,255,.9)}
.scroll{flex:1;width:100%;max-width:440px;overflow-y:auto;touch-action:pan-y;padding:14px 2px 30px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.lv{background:var(--cream);color:var(--ink);border-radius:16px;padding:10px 6px 8px;text-align:center;box-shadow:0 4px 0 #b98a5c,0 6px 12px rgba(0,0,0,.2);position:relative}
.lv .e{font-size:38px;line-height:1.1}
.lv .n{font-weight:800;font-size:13px;margin-top:4px;min-height:32px;display:flex;align-items:center;justify-content:center}
.lv .s{color:var(--gold);font-size:16px;letter-spacing:1px;text-shadow:0 1px 0 #8a5a00}
.lv .s .off{color:#d8c7ae;text-shadow:none}
.lv .num{position:absolute;top:6px;left:8px;font-size:12px;font-weight:800;opacity:.5}
.lv.locked{filter:grayscale(1);opacity:.55}
.lv.locked::after{content:"🔒";position:absolute;inset:0;display:grid;place-items:center;font-size:30px}
.recipe-card{background:var(--cream);color:var(--ink);border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:0 4px 0 #b98a5c;display:grid;grid-template-columns:1fr 2fr;gap:12px;align-items:center}
.recipe-card .big{display:grid;place-items:center;background:radial-gradient(circle at 50% 55%,#fff 0,#f6e7cc 70%);border-radius:14px;aspect-ratio:1;padding:6px}
.recipe-card .big .ic.dish{width:100%;height:auto;max-height:100%}
.recipe-card h3{margin:0 0 4px;font-size:17px;line-height:1.25}
.recipe-card .price-tag{margin-left:0;margin-top:2px}
.recipe-card p{margin:4px 0;font-size:14px;line-height:1.4}
.recipe-card .ings{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.recipe-card .ings span{background:#f3e3c8;border-radius:8px;padding:2px 6px;font-size:13px}
.recipe-card.locked{opacity:.6}
.recipe-card.locked .big{filter:grayscale(1) brightness(.3)}

/* ---------- Game HUD ---------- */
#game{gap:8px}
.hud{width:var(--bw);display:flex;flex-direction:column;gap:8px}
.hud-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);white-space:nowrap;background:linear-gradient(#7b4fd0,#5b34a8);border-radius:14px;padding:6px 14px;font-weight:900;font-size:22px;min-width:96px;text-align:center;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 3px 6px rgba(0,0,0,.25)}
.pill.score{background:linear-gradient(#7a4a26,#5a341c);border:2px solid var(--gold);font-size:26px;min-width:120px}
.pill small{display:block;font-size:11px;font-weight:800;opacity:.9;letter-spacing:1px;text-shadow:none}
.dish-title{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;text-shadow:0 2px 0 rgba(255,255,255,.7)}
.dish-title .e{font-size:30px}
.moves{font-weight:800;font-size:14px;background:rgba(255,255,255,.75);color:var(--fg);box-shadow:0 2px 0 rgba(31,74,55,.15);border-radius:10px;padding:4px 10px}
.recipe{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.chip{position:relative;background:var(--cream);color:var(--ink);border-radius:12px;padding:4px 8px 6px;min-width:58px;text-align:center;
  box-shadow:0 3px 0 #b98a5c;transition:transform .15s}
.chip .ce{font-size:22px;line-height:1.1}
.chip .cn{font-size:12px;font-weight:800}
.chip .bar{height:5px;background:#e7d3b3;border-radius:3px;overflow:hidden;margin-top:2px}
.chip .bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.chip.done{background:#d8f5d0}
.chip.done::after{content:"";background:url("assets/ui-check.webp") center/80% no-repeat #fff!important;position:absolute;top:-6px;right:-6px;background:var(--green);color:#fff;border-radius:50%;width:20px;height:20px;font-size:13px;font-weight:900;display:grid;place-items:center}
.chip.pop{transform:scale(1.18)}

/* ---------- Board (cutting board) ---------- */
#boardWrap{position:relative}
#board{width:var(--bw);height:var(--bw);padding:10px;border-radius:18px;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:0;
  background:linear-gradient(135deg,#6b3f22,var(--board));
  box-shadow:inset 0 0 0 3px var(--board-edge),0 6px 0 #3b1f0e,0 12px 24px rgba(0,0,0,.35)}
.cell{position:relative;background:var(--cell);box-shadow:inset 0 0 0 1px var(--cell-line)}
.tile{position:absolute;inset:1px;border-radius:7px;display:grid;place-items:center;font-size:calc(var(--cs) * .56);
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 70%,#fff) 0%,var(--c) 45%,color-mix(in srgb,var(--c) 75%,#000) 100%);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.45),0 1px 2px rgba(0,0,0,.35)}
.tile span{filter:drop-shadow(0 1px 1px rgba(0,0,0,.35));line-height:1}
.cell.ghost .tile{opacity:.45}
.cell.hint .tile{animation:glow .6s ease-in-out infinite alternate}
.cell.hint:not(:has(.tile))::before{content:"";position:absolute;inset:2px;border-radius:7px;background:rgba(255,220,120,.25)}
@keyframes glow{to{filter:brightness(1.35)}}
.tile.placed{animation:placed .18s ease-out}
@keyframes placed{from{transform:scale(.7)}to{transform:scale(1)}}
.tile.clear{animation:clear .35s ease-in forwards}
@keyframes clear{40%{transform:scale(1.15);filter:brightness(1.8)}100%{transform:scale(0) rotate(25deg);opacity:0}}

/* ---------- Tray ---------- */
.tray{width:var(--bw);height:calc(var(--cs) * 3.2);display:grid;grid-template-columns:repeat(3,1fr);align-items:center;margin-top:10px}
.slot{height:100%;display:grid;place-items:center;touch-action:none}
.piece{display:grid;gap:0;cursor:grab;transition:opacity .2s, transform .15s}
.piece.dim{opacity:.35;filter:grayscale(.7)}
.piece .pc{position:relative;width:calc(var(--cs) * .52);height:calc(var(--cs) * .52)}
.piece .pc .tile{font-size:calc(var(--cs) * .3);border-radius:5px}
.piece.hidden{visibility:hidden}
#drag{position:fixed;left:0;top:0;pointer-events:none;z-index:50;display:grid;will-change:transform}
#drag .pc{position:relative;width:var(--cs);height:var(--cs)}
#drag .tile{box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.45),0 6px 12px rgba(0,0,0,.35)}

/* ---------- FX ---------- */
.float-text{position:fixed;z-index:60;pointer-events:none;font-weight:900;font-size:34px;color:#fff6c8;
  text-shadow:0 3px 0 #b8461a,0 6px 12px rgba(0,0,0,.4);white-space:nowrap;transform:translate(-50%,-50%)}
.fly{position:fixed;z-index:55;pointer-events:none;font-size:24px;transform:translate(-50%,-50%)}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;background:rgba(30,15,5,.6);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
.modal.on{display:flex}
.card{background:var(--cream);color:var(--ink);border-radius:22px;padding:22px 20px;text-align:center;width:min(360px,100%);box-shadow:0 8px 0 #b98a5c,0 16px 30px rgba(0,0,0,.4);animation:pop .3s ease-out}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.card h2{margin:0 0 6px;font-size:26px}
.card .bigE{font-size:76px;line-height:1.1;animation:bob 1.6s ease-in-out infinite}
.card .stars{font-size:38px;color:var(--gold);text-shadow:0 2px 0 #8a5a00;letter-spacing:4px}
.card .stars .off{color:#d8c7ae;text-shadow:none}
.card p{margin:8px 0;line-height:1.45}
.card .fact{font-size:14px;background:#f3e3c8;border-radius:12px;padding:8px 10px}
.card .actions{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:14px}
.card .btn{min-width:220px;font-size:18px;padding:12px 18px}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;font-weight:700;border-bottom:1px solid #ead6b8}

/* ---------- Leaderboard ---------- */
.tabs{display:flex;gap:8px;width:100%;max-width:440px;margin-top:12px}
.tab{flex:1;padding:10px 4px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:5px;background:rgba(255,246,226,.75);color:var(--fg);font-weight:800;font-size:15px}
.tab[aria-selected="true"]{background:var(--cream);color:var(--ink);box-shadow:0 3px 0 #b98a5c}
.lb-note{background:rgba(255,246,226,.88);border-radius:12px;margin-bottom:8px;color:var(--fg);font-weight:600;text-align:center;font-size:14px;padding:10px 4px;line-height:1.45}
.lb-row{display:grid;grid-template-columns:34px 36px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--cream);color:var(--ink);
  border-radius:14px;padding:8px 12px;margin-bottom:8px;box-shadow:0 3px 0 #b98a5c}
.lb-row.me{background:#fff0b8;box-shadow:0 3px 0 #c9a227,0 0 0 2px var(--gold)}
.lb-rank{font-weight:900;font-size:18px;text-align:center;font-variant-numeric:tabular-nums}
.lb-av{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#e7d3b3}
.lb-name{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-name small{display:block;font-weight:600;opacity:.6;font-size:12px}
.lb-val{font-weight:900;font-size:18px;font-variant-numeric:tabular-nums;text-align:right}
.lb-val small{display:block;font-size:11px;font-weight:700;opacity:.6}
.rank-badge{display:inline-block;background:#3fae5a;color:#fff;border-radius:10px;padding:4px 10px;font-weight:800;font-size:14px;margin-top:4px}

/* ---------- Account gate ---------- */
#gate{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,rgba(255,246,226,.55),rgba(255,246,226,.3)),url("assets/bg-kitchen.webp") center bottom/cover no-repeat,#c9a77c}
#gate.on{display:flex}
#gate .card{animation:none}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid #e7d3b3;border-top-color:var(--accent);margin:8px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.acct{display:flex;align-items:center;gap:8px;color:#3b2412;padding:9px 26px;font-weight:800;font-size:14px;max-width:100%;
  background:url("assets/plank.webp") center/100% 100% no-repeat;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.acct img{width:28px;height:28px;border-radius:50%;background:#e7d3b3}
.acct span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plate{display:inline-block}
.plate.broken{opacity:.3;filter:grayscale(1) brightness(.6)}
.platebar{display:inline-flex;gap:1px;background:#6b4226;border-radius:10px;padding:2px 6px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}

/* ---------- Bếp nấu (ý tưởng 1) & quầy tính tiền (ý tưởng 2) ---------- */
.kwrap{width:100%;max-width:420px;flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:0}
.kcard{background:var(--cream);color:var(--ink);border-radius:22px;padding:18px 16px;box-shadow:0 6px 0 #b98a5c,0 12px 24px rgba(0,0,0,.18);text-align:center}
.kcard h2{margin:0 0 4px;font-size:24px}
.kstep{display:inline-block;background:#3fae5a;color:#fff;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:800;letter-spacing:.5px;margin-bottom:6px}
.khint{font-size:14px;line-height:1.45;margin:4px 0 10px;opacity:.85}
.kpan{font-size:70px;line-height:1.1;margin:6px 0;transition:transform .1s}
.kpan.sizzle{animation:sizzle .15s linear infinite}

let actx=null, sfxBus=null, musicBus=null, noiseBuf=null;
function ac(){
  if(actx) { if(actx.state==="suspended") actx.resume().catch(()=>{}); return actx; }
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    const comp=actx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4; comp.connect(actx.destination);
    sfxBus=actx.createGain(); sfxBus.gain.value=1.0; sfxBus.connect(comp);
    musicBus=actx.createGain(); musicBus.gain.value=0.55; musicBus.connect(comp);
    noiseBuf=actx.createBuffer(1,actx.sampleRate*1.5,actx.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }catch(e){ actx=null; }
  return actx;
}
function tone(freq,dur=0.08,type="sine",vol=0.3,delay=0,bus){
  if(!soundOn && !bus) return; const a=ac(); if(!a) return;
  const t=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(bus||sfxBus); o.start(t); o.stop(t+dur+0.03);
}
function noise(dur=0.1,vol=0.3,type="bandpass",freq=2000,q=1,delay=0){
  if(!soundOn) return null; const a=ac(); if(!a) return null;
  const t=a.currentTime+delay, src=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
  src.buffer=noiseBuf; src.loop=dur>1.4; f.type=type; f.frequency.value=freq; f.Q.value=q;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f).connect(g).connect(sfxBus); src.start(t); src.stop(t+dur+0.05);
  return {src,g};
}

/* ---------- Nhạc nền trang chủ: nhạc bếp vui nhộn (lead, bass nảy, hợp âm, trống, vỗ tay, hi-hat) ---------- */
const Music=(()=>{
  // Nhạc bếp vui nhộn: Đô trưởng, nhịp 150. Giai điệu tự sáng tác, 2 đoạn × 32 phách đơn.
  const N={c5:523.3,d5:587.3,e5:659.3,f5:698.5,g5:784,a5:880,b5:987.8,c6:1046.5};
  const MEL=[
    "e5","g5","c6","g5","a5","g5","e5",0,  "f5","a5","c6","a5","g5",0,"e5","g5",
    "e5","g5","c6","g5","a5","c6","b5","c6","g5",0,"e5","f5","d5","c5",0,0,
    "a5","a5","g5","e5","f5","f5","e5","c5","d5","e5","f5","a5","g5",0,"g5",0,
    "a5","a5","g5","e5","f5","a5","c6","a5","g5","e5","d5","e5","c5",0,"c5",0];
  const CH={C:[261.6,329.6,392],F:[349.2,440,523.3],G:[392,493.9,587.3]};
  const BARS=["C","F","C","G","F","C","F","G"], ROOT={C:130.8,F:174.6,G:196};
  const STEP=60/150/2; let timer=null, step=0, next=0, playing=false;
  const a=()=>actx;
  function env(g,t,v,att,dec){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+att); g.gain.exponentialRampToValueAtTime(0.0001,t+dec); }
  function osc(type,f,t,dur,v,filt){ const o=a().createOscillator(), g=a().createGain(); o.type=type; o.frequency.value=f;
    let n=o; if(filt){ const lp=a().createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=filt; o.connect(lp); n=lp; }
    n.connect(g); env(g,t,v,0.006,dur); g.connect(musicBus); o.start(t); o.stop(t+dur+0.05); return o; }
  function lead(f,t,len){ const o=osc("square",f,t,len,0.07,2600); const l=a().createOscillator(), lg=a().createGain();
    l.frequency.value=6; lg.gain.value=f*0.008; l.connect(lg); lg.connect(o.frequency); l.start(t+0.08); l.stop(t+len+0.05);
    osc("triangle",f*2,t,len*0.6,0.03); }
  function noiseHit(t,v,type,f,dur){ const src=a().createBufferSource(), fl=a().createBiquadFilter(), g=a().createGain();
    src.buffer=noiseBuf; fl.type=type; fl.frequency.value=f; env(g,t,v,0.002,dur); src.connect(fl).connect(g).connect(musicBus); src.start(t); src.stop(t+dur+0.05); }
  function kick(t){ const o=a().createOscillator(), g=a().createGain(); o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+0.12);
    env(g,t,0.6,0.003,0.18); o.connect(g); g.connect(musicBus); o.start(t); o.stop(t+0.2); }
  function tick(){ while(next<a().currentTime+0.3){
      const i=step%64, m=MEL[i], bar=Math.floor(i/8), inBar=i%8, ch=BARS[bar];
      if(m){ let len=STEP*0.9; let j=i+1; while(j<64&&MEL[j]===0&&j<i+3){ len+=STEP; j++; } lead(N[m],next,len); }
      osc("triangle", inBar%2? ROOT[ch]*2 : ROOT[ch], next, STEP*0.8, 0.22);              // bass nảy quãng tám
      if(inBar%2===1) CH[ch].forEach(f=>osc("sawtooth",f,next,STEP*0.55,0.035,1800));     // hợp âm nảy phách nghịch
      if(inBar===0||inBar===4) kick(next);
      if(inBar===2||inBar===6) noiseHit(next,0.32,"bandpass",1500,0.12);                  // vỗ tay
      noiseHit(next, inBar%2?0.07:0.04, "highpass", 8000, 0.04);                          // hi-hat
      if(i%32===0) osc("sine",2093,next,0.6,0.06);                                        // tiếng chuông mở đoạn
      step++; next+=STEP; } }
  return {
    start(){ if(playing||!musicOn) return; const c=ac(); if(!c||c.state!=="running") return;
      playing=true; step=0; next=c.currentTime+0.1; musicBus.gain.setTargetAtTime(0.5,c.currentTime,.3); tick(); timer=setInterval(tick,100); },
    stop(){ if(!playing) return; playing=false; clearInterval(timer); if(actx) musicBus.gain.setTargetAtTime(0,actx.currentTime,.2); },
    get on(){ return playing; }
  };
})();

/* ---------- Random helpers ---------- */
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function weighted(list,wf){ const tot=list.reduce((s,x)=>s+wf(x),0); let r=Math.random()*tot; for(const x of list){ r-=wf(x); if(r<=0) return x;} return list[list.length-1]; }

function canPlace(shape,r0,c0){
  for(const [r,c] of shape.cells){ const R=r0+r,C=c0+c; if(R<0||C<0||R>=N||C>=N||G.grid[R][C]) return false; }
  return true;
}
function fitsAnywhere(shape){ for(let r=0;r<=N-shape.h;r++) for(let c=0;c<=N-shape.w;c++) if(canPlace(shape,r,c)) return true; return false; }

function pickIngredient(){
  if(G.mode==="endless") return rnd(G.pool);
  // ưu tiên nguyên liệu còn thiếu
  const missing = Object.keys(G.need).filter(k=>(G.got[k]||0)<G.need[k]);
  if(Math.random()<0.72 && missing.length){
    return weighted(missing,k=>G.need[k]-(G.got[k]||0)+2);
  }
  return Math.random()<0.5 && G.extras.length ? rnd(G.extras) : rnd(Object.keys(G.need));
}

function makePiece(maxCells=99){
  const pool = SHAPES.filter(s=>s.cells.length<=maxCells);
  const shape = weighted(pool,s=>s.weight);
  return {shape, ing:pickIngredient()};
}
function refillTray(){
  // tạo 3 khối, đảm bảo ít nhất 1 khối đặt được (công bằng)
  for(let attempt=0;attempt<30;attempt++){
    const max = attempt<10?99:attempt<20?4:2;
    const t=[makePiece(max),makePiece(max),makePiece(max)];
    if(t.some(p=>fitsAnywhere(p.shape))||attempt===29){ G.tray=t; break; }
  }
}

  G.extras = []; for(let k=0;k<Math.min(1+Math.floor(i/3),3);k++){ const x=rnd(others.filter(o=>!G.extras.includes(o))); G.extras.push(x); }

// Vỡ 1 đĩa: dọn thớt, giữ nguyên liệu đã gom và điểm
function continueLevel(){
  G.grid=Array.from({length:N},()=>Array(N).fill(null));
  G.combo=0; G.movesSinceClear=0; G.over=false;
  refillTray(); renderBoard(); renderTray(); renderHUD();
}
function resetBoard(){
  G.grid=Array.from({length:N},()=>Array(N).fill(null));
  G.score=0; G.combo=0; G.movesSinceClear=0; G.used=0; G.over=false;
  refillTray(); renderBoard(); renderTray(); renderHUD();
}

function renderBoard(){
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const el=cellAt(r,c), ing=G.grid[r][c];
    el.className="cell";
    el.innerHTML = ing? tileHTML(ing):"";
  }
}
function pieceHTML(p,cls){
  let h=`<div class="${cls}" style="grid-template-columns:repeat(${p.shape.w},auto);grid-template-rows:repeat(${p.shape.h},auto)">`;
  const set=new Set(p.shape.cells.map(([r,c])=>r+","+c));
  for(let r=0;r<p.shape.h;r++) for(let c=0;c<p.shape.w;c++)
    h+= `<div class="pc">${set.has(r+","+c)?tileHTML(p.ing):""}</div>`;
  return h+"</div>";
}
function renderTray(){
  [...trayEl.children].forEach((slot,i)=>{
    const p=G.tray[i];
    slot.innerHTML = p? pieceHTML(p,"piece"+(fitsAnywhere(p.shape)?"":" dim")) : "";
  });
}
function starsHTML(n){ return [1,2,3].map(k=>IMG(k<=n?"ui-star":"ui-star-off")).join(""); }

function renderHUD(){
  const center=$("#hudCenter"), sub=$("#hudSub");
  if(G.mode==="endless"){
    // cỡ chữ co theo số chữ số để không tràn ô
    center.style.flex="1"; center.style.minWidth="0";
    const fit=n=>{ const d=String(n).length; return d<=3?26:d===4?22:d===5?19:16; };
    center.innerHTML=`<div class="pills"><div class="pill"><small>${T("best")}</small><span class="pv" style="font-size:${fit(best)}px">${IMG("ui-crown")}${best}</span></div><div class="pill score"><small>${T("score")}</small><span class="pv" style="font-size:${fit(G.score)+2}px">${G.score}</span></div></div>`;
    sub.innerHTML=`<div class="recipe">${G.pool.map(k=>`<div class="chip" style="min-width:40px;padding:3px 5px"><div class="ce">${ingE(k)}</div></div>`).join("")}</div>`;
  } else {
    const D=DISHES[G.level];
    center.style.flex=""; center.style.minWidth="";
    center.innerHTML=`${G.customer?`<span class="e" title="${G.customer.n}">${custE(G.customer)}</span>`:""}<span class="e">${dishE(D)}</span><span>${D.n}</span>`;
    sub.innerHTML=`<div class="hud-row" style="margin-bottom:6px"><span class="moves">${IMG("ui-order")} ${G.customer?G.customer.n:T("order")}</span><span class="moves">${T("scoreN",{v:G.score})}</span><span class="emoji" style="font-size:14px" title="${T("platesLeft")}" aria-label="${T("platesLeft")}: ${G.lives}">${heartsHTML()}</span></div>
      <div class="recipe">${Object.keys(G.need).map(k=>{
        const g=Math.min(G.got[k]||0,G.need[k]), pct=g/G.need[k]*100;
        return `<div class="chip ${g>=G.need[k]?"done":""}" data-ing="${k}"><div class="ce">${ingE(k)}</div><div class="cn">${g}/${G.need[k]}</div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
      }).join("")}</div>`;
  }
}

/* =========================================================
   DRAG & DROP
   ========================================================= */
let drag=null; // {i, piece, lift, w, h, pos:{r,c}|null}
function boardMetrics(){
  const a=cellAt(0,0).getBoundingClientRect(), b=cellAt(0,1).getBoundingClientRect();
  return {x:a.left,y:a.top,p:b.left-a.left,size:a.width};
}
trayEl.addEventListener("pointerdown",e=>{
  if(G.over) return;
  const slot=e.target.closest(".slot"); if(!slot) return;
  const i=[...trayEl.children].indexOf(slot), p=G.tray[i]; if(!p) return;
  e.preventDefault();
  const m=boardMetrics();
  drag={i,piece:p,m,lift:e.pointerType==="mouse"?0:m.p*1.6,pos:null};
  dragEl.style.gridTemplateColumns=`repeat(${p.shape.w},auto)`;
  dragEl.innerHTML=pieceHTML(p,"").replace(/^<div[^>]*>/,"").replace(/<\/div>$/,"");
  slot.firstElementChild.classList.add("hidden");
  sfx.pick(); moveDrag(e);
  try{ trayEl.setPointerCapture(e.pointerId); }catch(_){}
});
trayEl.addEventListener("pointermove",e=>{ if(drag) moveDrag(e); });
trayEl.addEventListener("pointerup",e=>{ if(drag) endDrag(); });
trayEl.addEventListener("pointercancel",()=>{ if(drag){ drag.pos=null; endDrag(); } });

function moveDrag(e){
  const {m,piece}=drag, w=piece.shape.w*m.p, h=piece.shape.h*m.p;
  const left=e.clientX-w/2, top=e.clientY-drag.lift-h/2 - (drag.lift?h/2:0);
  dragEl.style.transform=`translate(${left}px,${top}px)`;
  const c=Math.round((left-m.x)/m.p), r=Math.round((top-m.y)/m.p);
  const pos = canPlace(piece.shape,r,c)?{r,c}:null;
  if(JSON.stringify(pos)!==JSON.stringify(drag.pos)){ drag.pos=pos; preview(); }
}
function clearPreview(){
  cellEls.forEach(el=>{ if(el.classList.contains("ghost")) el.innerHTML=""; el.classList.remove("ghost","hint"); });
}
function preview(){
  clearPreview(); if(!drag.pos) return;
  const {r,c}=drag.pos, p=drag.piece;
  const tmp=G.grid.map(row=>row.slice());
  p.shape.cells.forEach(([dr,dc])=>{ const el=cellAt(r+dr,c+dc); el.classList.add("ghost"); el.innerHTML=tileHTML(p.ing); tmp[r+dr][c+dc]=p.ing; });
  const {rows,cols}=findLines(tmp);
  rows.forEach(R=>{for(let C=0;C<N;C++) cellAt(R,C).classList.add("hint");});
  cols.forEach(C=>{for(let R=0;R<N;R++) cellAt(R,C).classList.add("hint");});
}
function endDrag(){
  const d=drag; drag=null; dragEl.innerHTML=""; dragEl.style.transform="translate(-999px,-999px)";
  clearPreview();
  if(d.pos){ place(d.i,d.pos.r,d.pos.c); }
  else { const pe=trayEl.children[d.i].firstElementChild; if(pe) pe.classList.remove("hidden"); }
}

/* =========================================================
   CORE RULES
   ========================================================= */
function findLines(grid){
  const rows=[],cols=[];
  for(let r=0;r<N;r++) if(grid[r].every(Boolean)) rows.push(r);
  for(let c=0;c<N;c++){ let f=true; for(let r=0;r<N;r++) if(!grid[r][c]){f=false;break;} if(f) cols.push(c); }
  return {rows,cols};
}

function place(i,r0,c0){
  const p=G.tray[i];
  p.shape.cells.forEach(([dr,dc])=>{ G.grid[r0+dr][c0+dc]=p.ing; });
  G.tray[i]=null; G.used++; G.score+=p.shape.cells.length;
  renderBoard();
  p.shape.cells.forEach(([dr,dc])=>{ const t=cellAt(r0+dr,c0+dc).firstElementChild; if(t) t.classList.add("placed"); });
  sfx.place();

  const {rows,cols}=findLines(G.grid);
  const lines=rows.length+cols.length;
  if(lines){
    const cleared=new Map();
    rows.forEach(R=>{for(let C=0;C<N;C++) cleared.set(R*N+C,G.grid[R][C]);});
    cols.forEach(C=>{for(let R=0;R<N;R++) cleared.set(R*N+C,G.grid[R][C]);});
    G.combo = G.movesSinceClear<=2 ? G.combo+1 : 1;
    G.movesSinceClear=0;
    // bonus: hàng/cột toàn 1 loại nguyên liệu
    let pure=0;
    rows.forEach(R=>{ if(new Set(G.grid[R]).size===1) pure++; });
    cols.forEach(C=>{ if(new Set(G.grid.map(row=>row[C])).size===1) pure++; });
    const gain = lines*10*lines + (G.combo-1)*10 + pure*40 + cleared.size;
    G.score+=gain;

    // thu thập nguyên liệu
    const counts={};
    cleared.forEach(ing=>{ counts[ing]=(counts[ing]||0)+1; });
    const rect=boardEl.getBoundingClientRect();
    cleared.forEach((ing,idx)=>{
      const el=cellEls[idx], t=el.firstElementChild; if(t) t.classList.add("clear");
      if(G.mode==="level" && ing in G.need && (G.got[ing]||0)<G.need[ing]) flyTo(el,ing);
      G.grid[Math.floor(idx/N)][idx%N]=null;
    });
    if(G.mode==="level") Object.entries(counts).forEach(([k,v])=>{ if(k in G.need) G.got[k]=(G.got[k]||0)+v; });

    const CW=L(STR.comboWords); const word = pure? T("pureMatch",{n:pure+1}) : CW[Math.min(lines+G.combo-2,CW.length-1)];
    floatText(`${word}`, rect.left+rect.width/2, rect.top+rect.height*0.42);
    if(G.combo>1) floatText(T("combo",{n:G.combo}), rect.left+rect.width/2, rect.top+rect.height*0.56, 24, 120);
    floatText(`+${gain}`, rect.left+rect.width/2, rect.top+rect.height*0.68, 22, 200);
    sfx.clear(lines+G.combo-1);
    setTimeout(()=>{ renderBoard(); afterMove(); },360);
  } else {
    G.movesSinceClear++;
    if(G.movesSinceClear>2) G.combo=0;
    afterMove();
  }
}

function afterMove(){
  if(G.tray.every(x=>!x)) refillTray();
  renderTray(); renderHUD();
  if(G.mode==="endless" && G.score>best){ best=G.score; saveLocal(); }
  if(G.mode==="level" && Object.keys(G.need).every(k=>(G.got[k]||0)>=G.need[k])) return setTimeout(win,450);
  const alive=G.tray.filter(Boolean);
  if(alive.length && !alive.some(p=>fitsAnywhere(p.shape))) setTimeout(lose,500);
}

/* =========================================================
   FX
   ========================================================= */
function floatText(txt,x,y,size=34,delay=0){
  const d=document.createElement("div"); d.className="float-text"; d.textContent=txt;
  d.style.left=x+"px"; d.style.top=y+"px"; d.style.fontSize=size+"px"; d.style.opacity=0;
  document.body.appendChild(d);
  d.animate([{opacity:0,transform:"translate(-50%,-30%) scale(.6)"},{opacity:1,transform:"translate(-50%,-50%) scale(1.1)",offset:.25},{opacity:1,transform:"translate(-50%,-60%) scale(1)",offset:.7},{opacity:0,transform:"translate(-50%,-110%) scale(1)"}],
    {duration:1100,delay,easing:"ease-out",fill:"forwards"}).onfinish=()=>d.remove();
}
function flyTo(cellEl,ing){
  const chip=document.querySelector(`.chip[data-ing="${ing}"]`); if(!chip) return;
  const a=cellEl.getBoundingClientRect(), b=chip.getBoundingClientRect();
  const f=document.createElement("div"); f.className="fly"; f.innerHTML=ingE(ing);
  f.style.left=(a.left+a.width/2)+"px"; f.style.top=(a.top+a.height/2)+"px";
  document.body.appendChild(f);
  const dx=b.left+b.width/2-(a.left+a.width/2), dy=b.top+b.height/2-(a.top+a.height/2);
  f.animate([{transform:"translate(-50%,-50%) scale(1)"},{transform:`translate(calc(-50% + ${dx*.4}px),calc(-50% + ${dy*.4-40}px)) scale(1.4)`,offset:.4},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.6)`,opacity:.6}],
    {duration:650+Math.random()*250,easing:"ease-in"}).onfinish=()=>{ f.remove(); const c=document.querySelector(`.chip[data-ing="${ing}"]`); if(c){c.classList.add("pop"); setTimeout(()=>c.classList.remove("pop"),150);} };
}

// Giá (đơn vị nội bộ; hiển thị /1000 = xu)
const PRICE={omelette:25000,eggFriedRice:35000,sandwich:30000,ramen:45000,padThai:45000,tacos:40000,
  tomYum:50000,meatSpaghetti:50000,teriyakiFish:55000,sweetSour:50000,mapoTofu:45000,bibimbap:60000};
const COOK_TYPE={omelette:"hold",eggFriedRice:"hold",sandwich:"order",ramen:"timing",padThai:"hold",tacos:"order",
  tomYum:"timing",meatSpaghetti:"timing",teriyakiFish:"hold",sweetSour:"hold",mapoTofu:"timing",bibimbap:"order"};
const COOK={}; Object.keys(COOK_TYPE).forEach(id=>{ const o={type:COOK_TYPE[id]};
  Object.defineProperty(o,"t",{get:()=>L(COOK_TXT[id])});
  Object.defineProperty(o,"h",{get:()=>T(o.type==="hold"?"hintHold":o.type==="order"?"hintOrder":"hintTiming")}); COOK[id]=o; });
function quality(score){
  if(score>=85) return {k:"perfect",get label(){return IMG("ui-crown-new")+" "+T("qPerfect");},tip:0.2,score};
  if(score>=55) return {k:"good",get label(){return IMG("ui-smile")+" "+T("qGood");},tip:0.1,score};
  return {k:"burnt",get label(){return IMG("ui-burnt")+" "+T("qBurnt");},tip:0,score};
}
let kitchenRAF=0;
function stopKitchen(){ cancelAnimationFrame(kitchenRAF); kitchenRAF=0; }
function startCooking(D,done){
  stopKitchen();
  let cfg=COOK[D.id]||{type:"timing",t:D.n,h:T("hintTiming")};
  show("kitchen");
  const finish=(score,info={})=>{
    stopKitchen();
    const q=quality(Math.max(0,Math.min(100,Math.round(score))));
    q.miss=info.miss||0; q.slow=!!info.slow;
    const kb=$("#kBody");
    kb.innerHTML=`<div class="kcard"><span class="kstep">${T("cookStep")}</span><h2>${D.n}</h2>
      <div class="kpan">${dishE(D)}</div><p><span class="qbadge q-${q.k}">${q.label}</span></p>
      <p class="khint">${T("dishReady")}</p>
      <button class="btn green kbig" id="kNext" disabled style="opacity:.6">${T("serve")}</button></div>`;
    setTimeout(()=>{ const b=$("#kNext"); if(b){ b.disabled=false; b.style.opacity=""; } },700);
    q.k==="burnt"?sfx.bad():sfx.clear(q.k==="perfect"?3:1);
    $("#kNext").onclick=()=>done(q);
  };
  const head=`<span class="kstep">${T("cookStep")}</span><h2>${cfg.t}</h2><p class="khint">${cfg.h}</p>`;
  const PAN_IMG={sandwich:"ing-banhmi",tacos:"ing-banhtrang",bibimbap:"cook-dia"};
  cfg = {...cfg, pan: cfg.type==="hold" ? `<span class="pan-hold"><img class="chao" src="assets/cook-chao.webp" alt=""><img class="flame" src="assets/cook-lua.webp" alt=""></span>`
    : PAN_IMG[D.id] ? IMG(PAN_IMG[D.id]) : dishE(D)};
  if(cfg.type==="timing") cookTiming(head,cfg,finish);
  else if(cfg.type==="hold") cookHold(head,cfg,finish);
  else cookOrder(head,cfg,D,finish);
}

// Kiểu 1: chạm đúng lúc (3 lần)
function cookTiming(head,cfg,finish){
  $("#kBody").innerHTML=`<div class="kcard">${head}<div class="kpan emoji" id="kPan">${cfg.pan}</div>
    <div class="kdots" id="kDots">${IMG("ui-star-off","dim").repeat(3)}</div>
    <div class="tbar"><div class="tzone" id="kZone"></div><div class="tneedle" id="kNeedle"></div></div>
    <div class="kfeed" id="kFeed"></div>
    <button class="btn kbig" id="kTap">${T("tap")}</button></div>`;
  let round=0,pos=0,dir=1,last=performance.now(),zone={a:0,w:0},scores=[],locked=false;
  const speeds=[0.75,1.05,1.4];
  const newZone=()=>{ zone.w=[0.2,0.16,0.13][round]; zone.a=0.08+Math.random()*(0.84-zone.w);
    const z=$("#kZone"); z.style.left=zone.a*100+"%"; z.style.width=zone.w*100+"%"; };
  newZone();
  const loop=t=>{ const dt=Math.min(0.05,(t-last)/1000); last=t;
    if(!locked){ pos+=dir*speeds[round]*dt; if(pos>1){pos=1;dir=-1;} if(pos<0){pos=0;dir=1;} }
    const nd=$("#kNeedle"); if(!nd) return; nd.style.left=pos*100+"%"; kitchenRAF=requestAnimationFrame(loop); };
  kitchenRAF=requestAnimationFrame(loop);
  $("#kTap").onclick=()=>{
    if(locked) return; locked=true;
    const c=zone.a+zone.w/2, d=Math.abs(pos-c);
    let sc, msg;
    if(d<=zone.w/2){ sc=100-Math.round(d/(zone.w/2)*25); msg=sc>=90?T("tPerfect"):T("tNice"); sfx.sizzle(.6); sfx.star(); }
    else if(d<=zone.w/2+0.08){ sc=50; msg=T("tOff"); sfx.sizzle(.3); }
    else { sc=15; msg=T("tMiss"); sfx.bad(); }
    scores.push(sc); $("#kFeed").textContent=msg;
    $("#kDots").innerHTML=scores.map(x=>IMG(x>=75?"ui-star":x>=50?"ui-smile":"ui-star-off")).join("")+IMG("ui-star-off","dim").repeat(3-scores.length);
    $("#kPan").classList.add("sizzle"); setTimeout(()=>$("#kPan")&&$("#kPan").classList.remove("sizzle"),300);
    setTimeout(()=>{ round++; if(round>=3){ finish(scores.reduce((a,b)=>a+b,0)/3); return; }
      newZone(); locked=false; $("#kFeed").textContent=""; },650);
  };
}

// Kiểu 2: giữ lửa trong vùng xanh
function cookHold(head,cfg,finish){
  $("#kBody").innerHTML=`<div class="kcard">${head}<div class="kpan emoji" id="kPan">${cfg.pan}</div>
    <div class="tbar"><div class="tzone" id="kZone"></div><div class="tneedle" id="kNeedle"></div></div>
    <div class="kfeed" id="kFeed">${T("lowHeat")}</div>
    <button class="btn kbig" id="kHold" style="touch-action:none">${IMG("cook-lua")} ${T("holdHeat")}</button>
    <div class="kprog"><i id="kProg"></i></div></div>`;
  const DUR=8, W=0.24; let heat=0.15,hold=false,t0=null,last=null,inside=0;
  const fry=sizzleLoop();
  const btn=$("#kHold");
  const on=e=>{ e.preventDefault(); hold=true; }, off=()=>{ hold=false; };
  btn.addEventListener("pointerdown",on); btn.addEventListener("pointerup",off);
  btn.addEventListener("pointerleave",off); btn.addEventListener("pointercancel",off);
  const loop=t=>{
    if(t0===null){ t0=t; last=t; }
    const dt=Math.min(0.05,(t-last)/1000), el=(t-t0)/1000; last=t;
    heat=Math.max(0,Math.min(1,heat+(hold?0.6:-0.45)*dt));
    const c=0.55+0.2*Math.sin(el*1.4), a=c-W/2;
    const z=$("#kZone"); z.style.left=a*100+"%"; z.style.width=W*100+"%";
    $("#kNeedle").style.left=heat*100+"%";
    const inZ=Math.abs(heat-c)<=W/2; if(inZ) inside+=dt;
    $("#kFeed").innerHTML= inZ?`${T("goodHeat")} ${IMG("ui-check")}`: heat>c?`${T("tooHot")} ${IMG("cook-lua")}`:T("lowHeat");
    $("#kPan").classList.toggle("sizzle",inZ||heat>c); fry.set(0.05+heat*0.5);
    $("#kProg").style.width=Math.min(100,el/DUR*100)+"%";
    if(el>=DUR){ fry.stop(); finish(Math.min(100,inside/(DUR*0.8)*100)); return; }
    kitchenRAF=requestAnimationFrame(loop);
  };
  kitchenRAF=requestAnimationFrame(loop);
}

// Kiểu 3: chạm nguyên liệu theo đúng thứ tự
function cookOrder(head,cfg,D,finish){
  const seq=Object.keys(D.need);
  const shuffled=seq.slice().sort(()=>Math.random()-.5);
  $("#kBody").innerHTML=`<div class="kcard" id="kCard">${head}<div class="kpan emoji">${cfg.pan}</div>
    <div class="slots">${seq.map((k,i)=>`<div class="slot2" data-s="${i}"><span class="ghost">${ingE(k)}</span></div>`).join("")}</div>
    <div class="ingbtns">${shuffled.map(k=>`<button class="ingbtn" data-k="${k}" style="--c:${ING[k].c}" aria-label="${ING[k].n}">${ingE(k)}</button>`).join("")}</div>
    <div class="kfeed" id="kFeed"></div><div class="kprog"><i id="kProg"></i></div></div>`;
  const LIMIT=10; let idx=0,miss=0,t0=performance.now(),over=false;
  const end=()=>{ if(over) return; over=true; const el=(performance.now()-t0)/1000;
    const sc= idx<seq.length ? idx/seq.length*50-miss*10 : 100-miss*20-Math.max(0,el-4)*6;
    finish(sc,{miss,slow:idx<seq.length}); };
  document.querySelectorAll(".ingbtn").forEach(b=>b.onclick=()=>{
    if(over) return;
    if(b.dataset.k===seq[idx]){
      const sl=document.querySelector(`.slot2[data-s="${idx}"]`); sl.classList.add("ok"); sl.innerHTML=ingE(b.dataset.k);
      b.classList.add("used"); idx++; sfx.chop(); $("#kFeed").textContent="";
      if(idx>=seq.length) setTimeout(end,300);
    } else { miss++; sfx.bad(); $("#kFeed").textContent=T("wrongOrder"); const c=$("#kCard"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); }
  });
  const loop=t=>{ if(over) return; const el=(t-t0)/1000; $("#kProg").style.width=Math.min(100,el/LIMIT*100)+"%";
    if(el>=LIMIT){ end(); return; } kitchenRAF=requestAnimationFrame(loop); };
  kitchenRAF=requestAnimationFrame(loop);
}

const VL=new Proxy({},{get:(_,k)=>L(SAY_TXT.lines[k])});
const BILLS=[{v:500000,c:"#2a9fb8"},{v:200000,c:"#c0603a"},{v:100000,c:"#3f8f4a"},{v:50000,c:"#b04f86"},
  {v:20000,c:"#3c6fc4"},{v:10000,c:"#a68a2c"},{v:5000,c:"#6a5cad"}];
const billColor=v=>(BILLS.find(b=>b.v===v)||{}).c||"#777";

// Đồng xu (5–50) và thỏi vàng (100–500), vẽ bằng CSS cho tới khi có hình
const billHTML=(v,attr="")=>`<button class="bill tok ${v>=100000?"bar":"coin"} t${v/1000}" ${attr} aria-label="${v/1000} ${T("coins")}"><b>${v/1000}</b></button>`;

function startCheckout(D,q,done){
  stopKitchen();
  const C=G.customer||rnd(CUSTOMERS), price=PRICE[D.id]||30000;
  const payOpts=[50000,100000,200000,500000].filter(v=>v>price).slice(0,2);
  const paid=rnd(payOpts), change=paid-price;
  const PAT=15; let left=PAT, given=[], wrong=0, over=false, last=performance.now();
  show("kitchen");
  $("#kBody").innerHTML=`<div class="kcard" id="kCard"><span class="kstep">${T("payStep")}</span>
    <div class="cust"><div class="face">${custE(C)}</div><div class="bubble"><b>${C.n}</b><span id="kSay"></span></div></div>
    <p style="margin:10px 0 4px"><span style="font-size:30px">${dishE(D)}</span> <span class="qbadge q-${q.k}">${q.label}</span></p>
    <div class="billrow"><span>${T("price")}</span><span>${fmtVND(price)}</span></div>
    <div class="billrow"><span>${T("paid")}</span><span>${billHTML(paid,'disabled tabindex="-1"')}</span></div>
    <div class="billrow"><span>${T("counted")}</span><span id="kSum">${fmtVND(0)}</span></div>
    <div class="patience" title="${T("patience")}"><i id="kPat" style="width:100%"></i></div>
    <div class="given" id="kGiven"></div>
    <div class="bills">${BILLS.filter(b=>b.v<paid).map(b=>billHTML(b.v,`data-v="${b.v}"`)).join("")}</div>
    <div class="kfeed" id="kFeed"></div>
    <div style="display:flex;gap:8px"><button class="btn brown" style="min-width:0;flex:1;font-size:16px;padding:12px" id="kReset">${T("recount")}</button>
    <button class="btn green" style="min-width:0;flex:2;font-size:16px;padding:12px" id="kGive">${T("giveChange")}</button></div></div>`;
  const ri=Math.floor(Math.random()*REACT[q.k].length);
  $("#kSay").textContent=REACT[q.k][ri]+" "+L(SAY_TXT.payAsk);
  const sum=()=>given.reduce((a,b)=>a+b,0);
  const draw=()=>{ $("#kSum").textContent=fmtVND(sum());
    $("#kGiven").innerHTML=given.length?given.map((v,i)=>billHTML(v,`data-i="${i}" aria-label="${T("removeCoin",{v:v/1000})}"`)).join(""):`<span class="empty">${T("tapCoins")}</span>`; };
  draw();
  document.querySelectorAll(".bills .bill").forEach(b=>b.onclick=()=>{ if(over) return; given.push(+b.dataset.v); given.sort((a,b)=>b-a); sfx.paper(); draw(); });
  $("#kGiven").onclick=e=>{ const b=e.target.closest("[data-i]"); if(!b||over) return; given.splice(+b.dataset.i,1); draw(); };
  $("#kReset").onclick=()=>{ if(over) return; given=[]; draw(); };
  const close=(tip,msg,slow)=>{ over=true; stopKitchen(); $("#kSay").textContent=msg;
    $("#kFeed").textContent=tip?`+ ${fmtVND(price)} · boa ${fmtVND(tip)}`:`+ ${fmtVND(price)}`;
    setTimeout(()=>done({price,tip,total:price+tip,wrong,slow:!!slow}),1400); };
  $("#kGive").onclick=()=>{
    if(over) return;
    const s=sum();
    if(s===change){
      sfx.cash();
      const raw=price*q.tip*(0.4+0.6*left/PAT)*Math.max(0,1-wrong*0.3);
      const tip=Math.round(raw/1000)*1000;
      close(tip, tip?VL.oktip:VL.ok);
    } else {
      wrong++; left=Math.max(0,left-3); sfx.buzz();
      $("#kSay").textContent=s<change?VL.wless:VL.wmore;
      $("#kFeed").textContent= s<change?T("short",{v:fmtVND(change-s)}):T("over",{v:fmtVND(s-change)});
      const c=$("#kCard"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake");
    }
  };
  const loop=t=>{ if(over) return; const dt=Math.min(0.1,(t-last)/1000); last=t; left=Math.max(0,left-dt);
    $("#kPat").style.width=left/PAT*100+"%";
    if(left<=0){ close(0,VL.out,true); return; }
    kitchenRAF=requestAnimationFrame(loop); };
  kitchenRAF=requestAnimationFrame(loop);
}

}
// Khách chấm 1–5 sao: lấy mức thấp nhất trong các điều kiện
function rateOrder(q,lost,pay){
  let r = q.k==="perfect"?5 : q.k==="good"?4 : 3; const notes=[];
  if(q.k==="perfect") notes.push("nPerfect");
  else if(q.k==="good") notes.push("nGood");
  else notes.push("nBurnt");
  if(q.miss){ r=Math.min(r,2); notes.push("nWrongOrder"); }
  if(lost===1){ r=Math.min(r,2); notes.push("nOnePlate"); }
  if(lost>=2){ r=1; notes.push("nPlates:"+lost); }
  if(q.slow){ r=1; notes.push("nSlow"); }
  if(pay.wrong){ r=1; notes.push("nWrongChange"); }
  if(pay.slow){ r=1; notes.push("nWait"); }
  return {r,notes};
}
const REVIEW_SAY=new Proxy({},{get:(_,r)=>L(SAY_TXT.review[r])});
// Lý do đánh giá lưu dạng mã ("nSlow", "nPlates:2"); chữ cũ (bản trước) hiển thị nguyên văn
function noteText(n){ if(typeof n!=="string") return ""; const [k,v]=n.split(":"); return STR[k]?T(k,{n:v}):n; }
function finishWin(D,q,pay){
  const wasDone=G.wasDone, C=G.customer||rnd(CUSTOMERS);
  const {r,notes}=rateOrder(q,G.lost,pay);
  const rv=reviews(); rv[D.id]=rv[D.id]||{n:0,sum:0}; rv[D.id].n++; rv[D.id].sum+=r;
  const entry={c:C.id,r,n:notes,t:Date.now()};
  rv[D.id].log=(rv[D.id].log||[]).concat(entry).slice(-REVIEW_LOG_MAX);
  progress.stars[D.id]=Math.max(progress.stars[D.id]||0,r);
  progress.earned=earned()+pay.total; saveLocal(); syncMyScore();
  r>=4?sfx.win():sfx.bad();
  const pop=dishRating(D.id);
  modal(`<h2>${T("paidTitle")}</h2><div class="bigE">${dishE(D)}</div><h3 style="margin:4px 0">${D.n}</h3>
    ${reviewHTML({...entry,t:0})}
    <p style="font-size:14px">${T("popularity")} ${rateHTML(pop.avg)}<span class="rate-num">${pop.avg.toFixed(1)} · ${revN(pop.n)}</span></p>
    <p class="money">${T("earned",{v:`<b>${fmtVND(pay.total)}</b>`})}${pay.tip?` (${T("tip",{v:fmtVND(pay.tip)})})`:""}<br><small>${T("totalEarned",{v:fmtVND(earned())})}</small></p>
    <p class="fact">${D.d}</p>
    ${unlockedCount()>DISHES.indexOf(D)+1&&!wasDone?`<p class="rank-badge">${IMG("ui-unlock")} ${T("unlocked",{d:DISHES[DISHES.indexOf(D)+1].n})}</p>`:""}
    <div class="actions"><button class="btn green" data-act="next">${T("nextCustomer")}</button>
    <button class="btn" data-act="rank">${IMG("ui-trophy")} ${T("rank")}</button><button class="btn brown" data-act="home">${T("toShop")}</button></div>`);
}
function lose(){
  if(G.over) return; G.over=true; if(G.mode==="endless") sfx.lose(); syncMyScore();
  if(G.mode==="endless"){

function unlockedCount(){ let n=1; DISHES.forEach((d,i)=>{ if(progress.stars[d.id]) n=Math.max(n,i+2); }); return Math.min(n,DISHES.length); }

// Món mới mở khóa thì khách gọi món đó trước; còn lại ưu tiên món ít sao
function pickOrder(avoidId){
  const u=unlockedCount(), open=DISHES.slice(0,u);
  const fresh=open.filter(d=>!progress.stars[d.id]);
  if(fresh.length && !avoidId) return fresh[0];
  const pool=open.length>1?open.filter(d=>d.id!==avoidId):open;
  return weighted(pool,d=>{ const x=dishRating(d.id); return x?6-x.avg:3; });
}
function newOrder(avoidId){
  stopKitchen();
  G.mode="level";
  const D=pickOrder(avoidId), C=rnd(CUSTOMERS.filter(c=>!G.customer||c.n!==G.customer.n));
  G.customer=C;
  const isNew=!progress.stars[D.id];
  show("kitchen");
  $("#kBody").innerHTML=`<div class="kcard"><span class="kstep">${T("customerIn")}</span>
    <div class="cust"><div class="face">${custE(C)}</div><div class="bubble"><b>${C.n}</b><span id="oSay"></span></div></div>
    <div class="order-dish">${dishE(D)}</div>
    <h2>${D.n}${isNew?`<span class="newtag">${T("newDish")}</span>`:""}</h2>
    <p class="khint" style="margin:2px 0">${T("priceV",{v:fmtVND(PRICE[D.id]||30000)})}${dishRating(D.id)?` · ${rateHTML(dishRating(D.id).avg)}<span class="rate-num">${dishRating(D.id).avg.toFixed(1)}</span>`:""}</p>
    <div class="order-ings">${Object.entries(D.need).map(([k,v])=>`<span>${ingE(k)} ${ING[k].n} ×${v}</span>`).join("")}</div>
    <button class="btn green kbig" id="oTake">${T("takeOrder")}</button>
    <div style="display:flex;justify-content:space-between;margin-top:8px">
      <button class="linkbtn" id="oHome">${T("backShop")}</button>
      ${unlockedCount()>1?`<button class="linkbtn" id="oSkip">${T("otherCustomer")}</button>`:""}</div></div>`;
  $("#oSay").textContent=C.hi.replace("{d}",D.n);
  sfx.door();
  $("#oTake").onclick=()=>startLevel(DISHES.indexOf(D));
  $("#oHome").onclick=()=>show("home");
  const sk=$("#oSkip"); if(sk) sk.onclick=()=>newOrder(D.id);
}

   BẢNG XẾP HẠNG CHUNG (db: scores/<userId>)

const LB={db:null,user:null,myId:null,rows:[],state:"loading",canWrite:true,tab:"endless",writing:false};
function totalStars(){ return Object.values(progress.stars).reduce((a,b)=>a+b,0); }
function myRow(){ return LB.rows.find(r=>r.id===LB.myId); }
function sortedRows(tab){
  const key = tab==="endless" ? (r=>r.endless||0) : tab==="money" ? (r=>r.earned||0) : (r=>r.rsum||0);
  return LB.rows.filter(r=>key(r)>0).sort((a,b)=>key(b)-key(a) || (a.at||0)-(b.at||0));
}
function myRank(tab){ const i=sortedRows(tab).findIndex(r=>r.id===LB.myId); return i<0?null:i+1; }

async function renderRank(){
  const box=$("#rankList"); if(!$("#rank").classList.contains("on")) return;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.tab===LB.tab));
  if(LB.state==="off"){ box.innerHTML=`<div class="lb-note">${T("lbOff")}</div>`; return; }
  if(LB.state==="loading"){ box.innerHTML=`<div class="lb-note">${T("lbLoading")}</div>`; return; }
  const rows=sortedRows(LB.tab);
  let note = LB.state==="slow" ? `<div class="lb-note">${T("lbSlow")}</div>` : "";
  if(!LB.canWrite) note+=`<div class="lb-note">${T("lbReadonly")}</div>`;
  if(!rows.length){ box.innerHTML=note+`<div class="lb-note">${T("lbEmpty")}</div>`; return; }
  let ps={}; try{ if(LB.user) ps=await LB.user.profiles(rows.map(r=>r.id)); }catch(e){}
  const medal=[IMG("ui-medal-1"),IMG("ui-medal-2"),IMG("ui-medal-3")];
  box.innerHTML=note+rows.map((r,i)=>{
    const p=ps[r.id]||{}, me=r.id===LB.myId;
    const val = LB.tab==="endless"
      ? `${r.endless}<small>${T("pts")}</small>`
      : LB.tab==="money" ? `<span class="money">${fmtVND(r.earned)}</span><small>${T("earningsW")}</small>`
      : `${(r.rcount?r.rsum/r.rcount:0).toFixed(1)} ${IMG("ui-star")}<small>${revN(r.rcount||0)}</small>`;
    return `<div class="lb-row ${me?"me":""}"><div class="lb-rank">${i<3?`<span style="font-size:30px">${medal[i]}</span>`:i+1}</div>
      <img class="lb-av" alt="" data-av="${i}">
      <div class="lb-name" data-n="${i}"></div><div class="lb-val">${val}</div></div>`;
  }).join("");
  rows.forEach((r,i)=>{ const el=box.querySelector(`[data-n="${i}"]`); const nm=(ps[r.id]&&ps[r.id].name)||T("anon");
    const av=box.querySelector(`[data-av="${i}"]`); if(ps[r.id]&&ps[r.id].avatarUrl) av.src=ps[r.id].avatarUrl; else av.removeAttribute("src");
    el.textContent=nm; if(r.id===LB.myId){ const s=document.createElement("small"); s.textContent=T("you"); el.appendChild(s);} });
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{ LB.tab=t.dataset.tab; renderRank(); }));

// Ghi điểm của mình nếu tốt hơn bản đang lưu (gọi sau mỗi ván)
async function syncMyScore(){
  if(!LB.db||!LB.myId||!LB.canWrite||LB.writing) return;
  const cur=myRow()||{};
  const prog={...(cur.prog||{})};
  Object.entries(progress.stars).forEach(([k,v])=>{ prog[k]=Math.max(prog[k]||0,v); });
  const next={endless:Math.max(best,cur.endless||0), prog,
    stars:Object.values(prog).reduce((a,b)=>a+b,0), dishes:Object.keys(prog).length,
    earned:Math.max(earned(),cur.earned||0)};
  const rv={...(cur.rv||{})};
  Object.entries(reviews()).forEach(([k,v])=>{ if(!rv[k]||(v.n||0)>(rv[k].n||0)) rv[k]={n:v.n,sum:v.sum,log:(v.log||[]).slice(-REVIEW_LOG_MAX)}; });
  next.rv=rv; next.rcount=Object.values(rv).reduce((a,b)=>a+(b.n||0),0); next.rsum=Object.values(rv).reduce((a,b)=>a+(b.sum||0),0);
  if(next.endless===(cur.endless||0)&&next.earned===(cur.earned||0)&&JSON.stringify(prog)===JSON.stringify(cur.prog||{})&&JSON.stringify(rv)===JSON.stringify(cur.rv||{})) return;
  next.at=Date.now();
  LB.writing=true;
  try{ await LB.db.collection("scores").doc(LB.myId).set(next); }
  catch(e){ if(e&&e.code==="invalid_argument"){ LB.canWrite=false; renderRank(); } }
  finally{ LB.writing=false; }
}

    <p class="fact">${T("loginNote")}</p>`);
}
// Gộp tiến trình trên máy chủ vào máy này (lấy giá trị cao hơn)
function mergeCloud(){
  const mine=myRow(); if(!mine) return;
  Object.entries(mine.prog||{}).forEach(([k,v])=>{ if(DISHES.some(d=>d.id===k)) progress.stars[k]=Math.max(progress.stars[k]||0,+v||0); });
  best=Math.max(best,+mine.endless||0);
  progress.earned=Math.max(earned(),+mine.earned||0);
  const rv=reviews();
  Object.entries(mine.rv||{}).forEach(([k,v])=>{ if(DISHES.some(d=>d.id===k)&&(!rv[k]||(+v.n||0)>(rv[k].n||0))) rv[k]={n:+v.n||0,sum:+v.sum||0,log:Array.isArray(v.log)?v.log.filter(e=>e&&+e.r>=1&&+e.r<=5).slice(-REVIEW_LOG_MAX):[]}; });
  saveLocal();
}
async function showAccount(user){
  try{ const me=await user.me(); $("#acctName").textContent=(me.name||T("player")); $("#acctName").insertAdjacentHTML("beforeend",` · ${IMG("ui-cloud")} ${T("savedAccount")}`);
    if(me.avatarUrl) $("#acctAv").src=me.avatarUrl; $("#acct").hidden=false; }catch(e){}
}

(async()=>{
  if(!window.claude||typeof window.claude.use!=="function"){ LB.state="off"; $("#gate").classList.remove("on"); return; } // mở file trực tiếp: chơi offline
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    LB.user=user;
    if(!db||!user){ LB.state="off"; needLogin(); return; }
    LB.myId=await user.id();
    if(!LB.myId){ LB.state="off"; needLogin(); return; }
    ACCOUNT_ID=LB.myId;
    // lần đầu: chuyển tiến trình cũ (lưu chung trên máy) sang tài khoản
    progress=store.get(pkey("progress"),store.get("progress",{stars:{}})); best=store.get(pkey("best"),store.get("best",0));
    showAccount(user);
    const cw=await user.can("data.write"); if(cw===false) LB.canWrite=false;
    LB.db=db;
    let opened=false;
    const timer=setTimeout(()=>{
      if(LB.state==="loading"){ LB.state="slow"; renderRank();
        gate(`<h2>${T("slowTitle")}</h2><div class="bigE">${IMG("ui-wifi")}</div><p>${T("slowBody")}</p>
          <div class="actions"><button class="btn green" id="gateGo">${T("playOffline")}</button></div>`);
        $("#gateGo").onclick=()=>{ opened=true; openGame(); }; }
    },10000);
    let synced=false;
    db.collection("scores").limit(1000).onSnapshot(snap=>{
      LB.rows=snap.docs.map(d=>({id:d.id,...d.data()}));
      if(!snap.metadata.fromCache){ clearTimeout(timer); LB.state="ready";
        if(!synced){ synced=true; mergeCloud(); setTimeout(syncMyScore,0); if(!opened){ opened=true; openGame(); } } }
      else if(LB.state==="loading") LB.state="slow";
      renderRank();
    },err=>{ clearTimeout(timer); LB.state="slow"; renderRank(); if(!opened){ opened=true; openGame(); } });
  }catch(e){ LB.state="off"; needLogin(); }
})();

// hook cho test tự động
window.__BF={G,place,startLevel,startEndless,canPlace,fitsAnywhere};
</script>
